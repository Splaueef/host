name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyflakes aiohttp matplotlib sympy numpy Pillow -r hikka_hub/requirements.txt
      - name: Pyflakes
        run: python -m pyflakes *.py hikka_hub/*.py
      - name: Pytest
        run: python -m pytest -q
